name: Build & Package Android APK

'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK and Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Decode Release Keystore from Secrets (if configured)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "KEYSTORE_PATH=release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "SIGNING_STATUS=固定 KeyStore 簽署 (Release Key)" >> $GITHUB_ENV
            echo "Signing keystore decoded from GitHub Secrets."
          else
            echo "SIGNING_STATUS=臨時 Debug 簽署 (Secrets 待設定)" >> $GITHUB_ENV
            echo "KEYSTORE_BASE64 secret not provided. Building standard debug APK."
          fi

      - name: Build APK
        run: ./gradlew assemble

      - name: Verify APK Signature & Extract Fingerprints with apksigner
        run: |
          set -e
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          mkdir -p artifacts

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          UNSIGNED_RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          TARGET_APK=""
          if [ -f "$RELEASE_APK" ]; then
            TARGET_APK="$RELEASE_APK"
          elif [ -f "$DEBUG_APK" ]; then
            TARGET_APK="$DEBUG_APK"
          elif [ -f "$UNSIGNED_RELEASE_APK" ]; then
            TARGET_APK="$UNSIGNED_RELEASE_APK"
          fi

          if [ -z "$TARGET_APK" ] || [ ! -f "$TARGET_APK" ]; then
            echo "Error: No signed APK file found after build."
            exit 1
          fi

          NAMED_APK="artifacts/app-${SHORT_SHA}.apk"
          cp "$TARGET_APK" "$NAMED_APK"

          # 1. 計算 APK 檔案校驗碼 (File SHA-256 Checksum)
          FILE_SHA256=$(sha256sum "$NAMED_APK" | awk '{print $1}')
          echo "$FILE_SHA256" > "${NAMED_APK}.sha256"

          # 2. 使用 Android SDK apksigner 驗證並提取簽章憑證指紋
          APKSIGNER_BIN=$(find $ANDROID_SDK_ROOT/build-tools -name "apksigner" | sort -V | tail -n 1)
          if [ -z "$APKSIGNER_BIN" ]; then
            APKSIGNER_BIN="apksigner"
          fi

          echo "Using apksigner: $APKSIGNER_BIN"
          VERIFY_OUTPUT=$("$APKSIGNER_BIN" verify --verbose --print-certs "$NAMED_APK")

          CERT_SHA1=$(echo "$VERIFY_OUTPUT" | grep -i "certificate SHA-1 digest:" | head -n 1 | awk '{print $NF}' | sed 's/../&:/g;s/:$//' | tr 'a-z' 'A-Z')
          CERT_SHA256=$(echo "$VERIFY_OUTPUT" | grep -i "certificate SHA-256 digest:" | head -n 1 | awk '{print $NF}' | sed 's/../&:/g;s/:$//' | tr 'a-z' 'A-Z')

          if [ -z "$CERT_SHA1" ]; then
            echo "Error: Failed to extract SHA-1 signature fingerprint from APK."
            exit 1
          fi

          # 3. 輸出 apk_signature_fingerprints.txt
          REPORT_FILE="artifacts/apk_signature_fingerprints.txt"
          cat << EOF > "$REPORT_FILE"
          ===================================================================
          MoneyTracker Android App - APK 簽章指紋報告 (Google Cloud OAuth 專用)
          ===================================================================

          [基本資訊]
          - APK 檔名: app-${SHORT_SHA}.apk
          - Commit SHA: ${{ github.sha }}
          - Application ID / Package: com.moneytracker.app
          - 簽章模式狀態: ${SIGNING_STATUS}

          [Google Cloud Console OAuth 2.0 Client 登記資訊]
          - Package Name: com.moneytracker.app
          - SHA-1 簽章憑證指紋: ${CERT_SHA1}
          - SHA-256 簽章憑證指紋: ${CERT_SHA256}

          [APK 檔案校驗碼 (File Checksum)]
          - APK 檔案 SHA-256: ${FILE_SHA256}

          ⚠️ 聲明:
          1. 請將上述「SHA-1 簽章憑證指紋」填入 Google Cloud Console > 憑證 > Android OAuth 用戶端 ID。
          2. 請勿將「APK 檔案 SHA-256 校驗碼」與「簽章憑證指紋」混淆。
          EOF

          cat "$REPORT_FILE"

          # 4. 寫入 GitHub Actions Job Summary
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ### 📱 MoneyTracker APK 建置與簽章指紋報告

          * **APK 檔名**: \`app-${SHORT_SHA}.apk\`
          * **Commit SHA**: \`${{ github.sha }}\`
          * **Package Name**: \`com.moneytracker.app\`
          * **簽章模式**: **${SIGNING_STATUS}**

          #### 🔑 Google Cloud Console OAuth 2.0 設定必填資訊：
          * **SHA-1 簽章憑證指紋**:
            \`\`\`text
            ${CERT_SHA1}
            \`\`\`
          * **SHA-256 簽章憑證指紋**:
            \`\`\`text
            ${CERT_SHA256}
            \`\`\`

          #### 📄 APK 檔案校驗碼 (File Checksum)：
          * **APK File SHA-256**: \`${FILE_SHA256}\`
          EOF

      - name: Upload APK & Signature Fingerprint Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-apk-${{ github.sha }}
          path: artifacts/*
          retention-days: 30

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 30
