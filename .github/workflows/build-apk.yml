name: Build & Package Android APK

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK and Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Prepare APK Artifacts and SHA-256 Checksum
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          mkdir -p artifacts

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          NAMED_APK="artifacts/app-debug-${SHORT_SHA}.apk"

          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "$NAMED_APK"
            sha256sum "$NAMED_APK" | awk '{print $1}' > "${NAMED_APK}.sha256"
            echo "APK and SHA-256 checksum created successfully."
          else
            echo "APK file not found at $APK_PATH"
          fi

      - name: Upload APK and SHA-256 Checksum Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-${{ github.sha }}
          path: artifacts/*
          retention-days: 30

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 30
